          const [rows, cols] = currentGridType.split('x').map(Number);
          const picker = document.getElementById('cell-picker');
          const grid = document.getElementById('cell-picker-grid');
          const cancelBtn = document.getElementById('cell-picker-cancel');

          if (!picker || !grid || !cancelBtn) {
            resolve(null);
            return;
          }

          grid.innerHTML = '';
          grid.style.gridTemplateColumns = `repeat(${cols}, minmax(60px, 1fr))`;

          for (let r = 0; r < rows; r++) {
            for (let c = 0; c < cols; c++) {
              const cell = document.createElement('div');
              cell.className = 'picker-cell';
              cell.textContent = `${r + 1},${c + 1}`;
              cell.addEventListener('click', () => {
                picker.style.display = 'none';
                resolve({ row: r, col: c });
              });
              grid.appendChild(cell);
            }
          }

          const onCancel = () => {
            picker.style.display = 'none';
            cancelBtn.removeEventListener('click', onCancel);
            resolve(null);
          };
          cancelBtn.addEventListener('click', onCancel);

          picker.style.display = 'flex';
        });
      }
      function clearGrid() {
        if (!page) return;
        const toRemove = [];
        for (let i = 0; i < page.components.count; i++) {
          toRemove.push(i);
        }
        toRemove.reverse().forEach(i => page.components.removeAt(i));
        // Skip designer.renderHtml: il designer è nascosto, basta il modello.
      }

      /* ---------- OHIF GRID LOGIC ---------- */
      function setupMegaGrid() {
        const cells = document.querySelectorAll('#megaGrid .mega-cell');

        cells.forEach((cell, index) => {
          const r = Math.floor(index / 4);
          const c = index % 4;

          cell.addEventListener('mouseenter', () => {
            cells.forEach((c2, idx2) => {
              const r2 = Math.floor(idx2 / 4);
              const c2col = idx2 % 4;
              if (r2 <= r && c2col <= c) c2.classList.add('highlight');
              else c2.classList.remove('highlight');
            });
          });

          cell.addEventListener('mouseleave', () => {
            cells.forEach(c2 => c2.classList.remove('highlight'));
          });

          cell.addEventListener('click', () => {
            cells.forEach(c2 => c2.classList.remove('selected'));
            cell.classList.add('selected');
            // Click esplicito dell'utente: blocca l'auto-pick.
            userSelectedGridManually = true;
            selectGrid(cell.dataset.layout);
          });
        });
      }

      // Aggiorna lo stato visivo del megaGrid in modo che il layout passato
      // (es. dall'auto-pick) appaia "selected" nel pannello.
      function highlightMegaGridLayout(layoutType) {
        const cells = document.querySelectorAll('#megaGrid .mega-cell');
        cells.forEach(c => {
          c.classList.toggle('selected', c.dataset.layout === layoutType);

      }

      /* ------------ GRID APPLY ------------ */

        // Cambio griglia → le coordinate (row,col) cambiano di significato,

      async function addGrid(type) {
        clearGrid();
        if (page) {
          page._nolexOffsetApplied = { x: 0, y: 0 };
        }

        const preferiti = loadPreferiti();
        const patient = getPatientInfo();

        const [rows, cols] = type.split('x').map(Number);

        const study = getStudyInfo();
        const titleText = SHOW_STUDY_TITLE ? buildStudyTitleText(patient, study) : '';

        const W = page.pageWidth;
        const H = page.pageHeight;
        const titleH = titleText ? STUDY_TITLE_HEIGHT_CM : 0;
        const gridTop = titleH;
        const gridH = H - titleH;
        const isA4Portrait = Math.abs(W - 21) < 0.01 && Math.abs(H - 29.7) < 0.01;
        const titleYOffset = isA4Portrait ? Math.round(((titleH * 96) / 2.54) * 0.25) : 0;
        const infoYOffset = 0;

        const cellW = W / cols;
        const cellH = gridH / rows;

        ensurePageBackground(W, H);
        ensureGridBackground(W, H);
        ensureGridFill(W, H);
        ensureGridImageFill(W, gridTop, gridH);
        addStudyTitle(titleText, W, titleH, titleYOffset);
        ensureCellBackgrounds(rows, cols, cellW, cellH, gridTop);

        if (!preferiti.length) {
          ensureEmptyCellBorders(rows, cols, cellW, cellH, gridTop);
          // Skip designer.renderHtml.
          renderEditorView();
          return;
        }

        /* --- BLACK BACKGROUND PANEL --- */
        const bg = new Stimulsoft.Report.Components.StiPanel();
        bg.left = 0;
        bg.top = 0;
        bg.width = W;
        bg.height = H;
        // bg.backColor = '#000';
        bg.locked = true;
        bg.enabled = false;
        // page.backColor = '#000000';

        // page.components.add(bg);

        /* --- GRID PANELS --- */
        // for (let r = 0; r < rows; r++) {
        //   for (let c = 0; c < cols; c++) {
        //     const p = new Stimulsoft.Report.Components.StiPanel();
        //     p.left = c * cellW;
        //     p.top = r * cellH;
        //     p.width = cellW;
        //     p.height = cellH;
        //     p.border.size = 0.3;
        //     p.locked = true;
        //     p.enabled = true;
        //      page.components.add(p);
        //   }
        // }

        /* --- LOAD IMAGES (parallelo + cache) ---
           Costruiamo prima la lista dei "slot" cella → preferito, poi
           carichiamo TUTTE le immagini in parallelo via loadSourceImageCached.
           Le immagini cachate (es. cambio formato) ritornano sincronicamente
           senza I/O. Compose e add sono sincroni → niente await sequenziali. */
        const totalCells = rows * cols;
        const limit = Math.min(totalCells, preferiti.length);
        const cellSlots = [];
        for (let i = 0; i < limit; i++) {
          const r = Math.floor(i / cols);
          const c = i % cols;
          const p = preferiti[i];
          cellSlots.push({
            r,
            c,
            cleanUrl: p.DataUrl,
            // Fallback al pulito se il preferito non ha la versione annotata
            // (preferito vecchio o cattura SVG fallita)
            annotatedUrl: p.DataUrlAnnotated || p.DataUrl,
          });
        }

        // Sceglie l'URL "attivo" in base alla checkbox annotazioni
        const sourceFor = slot => (showAnnotations ? slot.annotatedUrl : slot.cleanUrl);

        const loadedImgs = await Promise.all(
          cellSlots.map(s => loadSourceImageCached(sourceFor(s)))
        );

        const PX = 96 / 2.54;
        const cellWpx = Math.max(1, Math.round(cellW * PX));
        const cellHpx = Math.max(1, Math.round(cellH * PX));

        for (let i = 0; i < cellSlots.length; i++) {
          const slot = cellSlots[i];
          const img = loadedImgs[i];
          if (!img) continue;

          const cellTransform = getTransform(slot.r, slot.c);
          const composedUrl = composeImageOnBlack(
            img,
            cellWpx,
            cellHpx,
            cellWpx / img.width,
            cellHpx / img.height,
            cellTransform
          );

          const left = slot.c * cellW;
          const top = gridTop + slot.r * cellH;

          const stiImg = new Stimulsoft.Report.Components.StiImage();
          stiImg.left = left;
          stiImg.top = top;
          stiImg.width = cellW;
          stiImg.height = cellH;
          stiImg.imageURL = composedUrl;
          stiImg.imageAsBase64 = true;
          stiImg.backColor = PRINT_BLACK;
          stiImg.brush = new Stimulsoft.Base.Drawing.StiSolidBrush(
            createColor(0, 0, 0, 255, 'PrintBlack')
          );
          stiImg.margins = new Stimulsoft.Report.Components.StiMargins(0, 0, 0, 0);
          stiImg.stretch = true;
          stiImg.aspectRatio = false;
          stiImg.keepAspectRatio = false;
          stiImg.locked = true;
          stiImg.enabled = true;
          stiImg.allowResize = false;
          stiImg.allowMove = false;
          stiImg.tag = sourceFor(slot);
          // Memorizza ENTRAMBI gli URL sul componente: recomposeAllCells e
          // recompositeImageComponents leggeranno quello giusto in base
          // allo stato corrente di showAnnotations (via getEffectiveSourceUrl).
          stiImg._nolexCleanUrl = slot.cleanUrl;
          stiImg._nolexAnnotatedUrl = slot.annotatedUrl;
          const composeKey =
            getComposeKey(cellWpx, cellHpx) +
            '|' +
            cellTransform.zoom +
            '|' +
            cellTransform.panX +
            '|' +
            cellTransform.panY +
            '|' +
            (showPatientInfo ? '1' : '0') +
            '|' +
            (showAnnotations ? '1' : '0');
          stiImg._nolexComposeKey = composeKey;
          stiImg.name = `Image_${slot.r}_${slot.c}_${Date.now()}`;

          page.components.add(stiImg);
        }

        // Ridisegna le linee griglia sopra gli elementi per stamparle
        ensureEmptyCellBorders(rows, cols, cellW, cellH, gridTop);

        // NIENTE designer.renderHtml: il designer è nascosto fuori vista,
        // i suoi pixel non li guarda nessuno. Il modello (page.components)
        // è già aggiornato e basta a printCurrent + renderEditorView.
        renderEditorView();
      }

      async function prepareImagesForPrint() {

      // Estrae (row, col) dal nome di un componente Image_ — null se non valido
      function parseImageCellName(name) {
        if (!name || typeof name !== 'string' || !name.startsWith('Image_')) return null;
        const parts = name.split('_');
        if (parts.length < 3) return null;
        const r = parseInt(parts[1]);
        const c = parseInt(parts[2]);
        if (isNaN(r) || isNaN(c)) return null;
        return { row: r, col: c };
      }

      async function recompositeImageComponents(options = {}) {
        if (!page) return;
        const force = !!options.force;
        const reason = options.reason || 'unknown';
        const PX = 96 / 2.54;
        const tasks = [];
        let scannedPanels = 0;
        let skippedByCache = 0;
        let missingSource = 0;
        let composedCount = 0;
        let loadFailures = 0;

        for (let i = 0; i < page.components.count; i++) {
          const panel = page.components.getByIndex(i);
          if (!panel || !panel.name) {
            continue;
          }
          if (!panel.name.startsWith('Image_')) {
            continue;
          }
          scannedPanels++;

          // Sceglie pulito o annotato in base allo stato corrente di
          // showAnnotations (con fallback su tag per backward-compat)
          const sourceUrl = getEffectiveSourceUrl(panel);
          if (!sourceUrl) {
            missingSource++;
            continue;
          }

          const child = panel;
          const cellInfo = parseImageCellName(panel.name);
          const transform = cellInfo ? getTransform(cellInfo.row, cellInfo.col) : TRANSFORM_DEFAULT;

          const wpx = Math.max(1, Math.round(panel.width * PX));
          const hpx = Math.max(1, Math.round(panel.height * PX));
          // La compose key include zoom/pan/showInfo/showAnnotations così
          // se uno qualsiasi di questi cambia, ricomponiamo.
          const composeKey =
            getComposeKey(wpx, hpx) +
            '|' +
            (transform.zoom || 1) +
            '|' +
            (transform.panX || 0) +
            '|' +
            (transform.panY || 0) +
            '|' +
            (showPatientInfo ? '1' : '0') +
            '|' +
            (showAnnotations ? '1' : '0');
          if (!force && child._nolexComposeKey === composeKey) {
            skippedByCache++;
            continue;
          }

          tasks.push(async () => {
            const im = await loadSourceImageCached(sourceUrl);
            if (!im) {
              loadFailures++;
              return;
            }

            const composedUrl = composeImageOnBlack(
              im,
              wpx,
              hpx,
              wpx / im.width,
              hpx / im.height,
              transform
            );
            child.imageURL = composedUrl;
            child.imageAsBase64 = true;
            child.stretch = true;
            child.aspectRatio = false;
            child.keepAspectRatio = false;
            child.margins = new Stimulsoft.Report.Components.StiMargins(0, 0, 0, 0);
            child.backColor = PRINT_BLACK;
            child.brush = new Stimulsoft.Base.Drawing.StiSolidBrush(
              createColor(0, 0, 0, 255, 'PrintBlack')
            );
            child._nolexComposeKey = composeKey;
            composedCount++;
          });
        }

        if (tasks.length) {
          await Promise.all(tasks);
          // Skip designer.renderHtml: la stampa legge direttamente da
          // page.components, non dal DOM del designer (che è nascosto).
        }

        logPrintDebug('recompositeImageComponents', {
          reason,
          force,
          scannedPanels,
          queuedTasks: tasks.length,
          skippedByCache,
          missingSource,
          composedCount,
          loadFailures,
          showAnnotations,
          showPatientInfo,
        });
      }

      function setupImageRecomposeListeners() {
        const container = document.getElementById('designer-container');
        if (!container) return;

        let timer = null;
        const schedule = () => {
          if (timer) clearTimeout(timer);
          timer = setTimeout(() => {
            recompositeImageComponents();
          }, 120);
        };

        container.addEventListener('mouseup', schedule);
        container.addEventListener('touchend', schedule);
        container.addEventListener('mouseleave', schedule);
      }

      /* ---------- FORMAT + SETTINGS PERSISTENTI ---------- */
      // Chiave localStorage in cui memorizziamo SOLO il formato corrente
      // (es. "A4|portrait" o "SRA3|landscape"). Persistente tra sessioni
      // così l'utente ritrova l'ultimo formato usato. NON memorizziamo
      // griglia, zoom, disposizione o altro: solo il formato pagina.
      const FORMAT_STORAGE_KEY = 'nolex-print-format';

      // Mostra/nascondi le info paziente sovraimpresse alle immagini.
      // Stato globale; viene letto da drawPatientInfoOnCanvas. Persistiamo
      // la scelta dell'utente (default: true = mostrate).
      const SHOW_INFO_STORAGE_KEY = 'nolex-print-show-patient-info';
      let showPatientInfo = true;
      try {
        // Default true: solo se l'utente ha esplicitamente messo '0'
        // (= ha disattivato in passato) lo lasciamo a false.
        const stored = localStorage.getItem(SHOW_INFO_STORAGE_KEY);
        showPatientInfo = stored !== '0';
      } catch (_) {
        /* ignora */
      }

      // Moltiplicatore della dimensione del testo info paziente.
      // 1.0 = comportamento di default (medio). Valori validi:
      //   0.7 = piccolo, 1.0 = medio, 1.4 = grande, 1.8 = extra grande
      // Persistito in localStorage. La posizione LEFT del testo (paddingX)
      // resta invariata: cambia solo la fontSize.
      const INFO_SIZE_STORAGE_KEY = 'nolex-print-info-size';
      let infoSizeMultiplier = 1.0;
      try {
        const stored = localStorage.getItem(INFO_SIZE_STORAGE_KEY);
        const parsed = parseFloat(stored);
        if (Number.isFinite(parsed) && parsed >= 0.5 && parsed <= 3.0) {
          infoSizeMultiplier = parsed;
        }
      } catch (_) {}

      // Handler della checkbox "Info esame" in toolbar
      async function onShowPatientInfoChange(checked) {
        showPatientInfo = !!checked;
        try {
          localStorage.setItem(SHOW_INFO_STORAGE_KEY, showPatientInfo ? '1' : '0');
        } catch (_) {}
        // Mostra/nascondi anche il select della dimensione: ha senso solo
        // quando le info sono visibili.
        const sizeSel = document.getElementById('infoSizeSelect');
        if (sizeSel) sizeSel.classList.toggle('hidden', !showPatientInfo);
        // Path veloce: invece di rifare addGrid (che ricrea tutti i
        // componenti Stimulsoft), aggiorniamo SOLO l'imageURL delle celle
        // esistenti via recomposeAllCells. Niente clear, niente add,
        // niente nuovi StiImage. Decine di volte più veloce.
        await recomposeAllCells();
      }

      // Handler del select "Dimensione info esame"
      async function onInfoSizeChange(value) {
        const parsed = parseFloat(value);
        if (!Number.isFinite(parsed) || parsed < 0.5 || parsed > 3.0) return;
        infoSizeMultiplier = parsed;
        try {
          localStorage.setItem(INFO_SIZE_STORAGE_KEY, String(infoSizeMultiplier));
        } catch (_) {}
        // Stesso path veloce: aggiorna solo l'imageURL delle celle esistenti
        await recomposeAllCells();
      }

      // Mostra/nascondi le ANNOTAZIONI (misurazioni, length, area, ecc.)
      // sovraimpresse alle immagini. A "favorito-add" tempo, Preferiti.tsx
      // cattura DUE versioni: DataUrl (pulita) e DataUrlAnnotated (con
      // annotazioni). Lo stato qui sceglie quale URL caricare per ogni cella.
      // Default: false (= immagini pulite, comportamento backward-compatible).
      const SHOW_ANNOTATIONS_STORAGE_KEY = 'nolex-print-show-annotations';
      let showAnnotations = false;
      try {
        showAnnotations = localStorage.getItem(SHOW_ANNOTATIONS_STORAGE_KEY) === '1';
      } catch (_) {}

      // Handler della checkbox "Annotazioni" in toolbar
      async function onShowAnnotationsChange(checked) {
        showAnnotations = !!checked;
        try {
          localStorage.setItem(SHOW_ANNOTATIONS_STORAGE_KEY, showAnnotations ? '1' : '0');
        } catch (_) {}
        // Stesso path veloce della checkbox info esame
        await recomposeAllCells();
      }

      // Helper centrale per scegliere il source URL effettivo di una cella
      // in base allo stato corrente della checkbox annotazioni. Usato da
      // addGrid, addImageToCell, recomposeAllCells e recompositeImageComponents.
      // Fallback: se non ci sono i due URL custom (es. preferito vecchio
      // senza DataUrlAnnotated), usa stiImg.tag come prima.
      function getEffectiveSourceUrl(stiImg) {
        if (!stiImg) return null;
        if (showAnnotations && typeof stiImg._nolexAnnotatedUrl === 'string') {
          return stiImg._nolexAnnotatedUrl;
        }
        if (typeof stiImg._nolexCleanUrl === 'string') {
          return stiImg._nolexCleanUrl;
        }
        return typeof stiImg.tag === 'string' ? stiImg.tag : null;
      }

      // Ricompone tutte le celle con immagine usando il transform corrente
      // e il flag showPatientInfo. Aggiorna stiImg.imageURL in place senza
      // modificare la struttura di page.components. Usato per i cambi di
      // stato che NON cambiano la geometria delle celle (es. toggle info).
      async function recomposeAllCells() {
        if (!page) return;

        // Raccogli tutte le cells "Image_..." esistenti
        const cells = [];
        for (let i = 0; i < page.components.count; i++) {
          const c = page.components.getByIndex(i);
          if (!c || !c.name || !c.name.startsWith('Image_')) continue;
          const info = parseImageCellName(c.name);
          if (!info) continue;
          // Sceglie pulito o annotato in base allo stato corrente di
          // showAnnotations (con fallback su tag per backward-compat)
          const sourceUrl = getEffectiveSourceUrl(c);
          if (!sourceUrl) continue;
          cells.push({ stiImg: c, row: info.row, col: info.col, sourceUrl });
        }
        if (!cells.length) {
          renderEditorView();
          return;
        }

        // Pre-carica tutti i sorgenti in parallelo (cache hit istantanei)
        const imgs = await Promise.all(cells.map(c => loadSourceImageCached(c.sourceUrl)));

        const PX = 96 / 2.54;
        for (let i = 0; i < cells.length; i++) {
          const c = cells[i];
          const im = imgs[i];
          if (!im) continue;
          const wpx = Math.max(1, Math.round(c.stiImg.width * PX));
          const hpx = Math.max(1, Math.round(c.stiImg.height * PX));
          const transform = getTransform(c.row, c.col);
          const composed = composeImageOnBlack(
            im,
            wpx,
            hpx,
            wpx / im.width,
            hpx / im.height,
            transform
          );
          c.stiImg.imageURL = composed;
          // Aggiorna anche il tag con l'URL attivo (utile per backward-compat
          // con codice che legge stiImg.tag)
          c.stiImg.tag = c.sourceUrl;
          c.stiImg._nolexComposeKey =
            getComposeKey(wpx, hpx) +
            '|' +
            transform.zoom +
            '|' +
            transform.panX +
            '|' +
            transform.panY +
            '|' +
            (showPatientInfo ? '1' : '0') +
            '|' +
            (showAnnotations ? '1' : '0');
        }

        renderEditorView();
      }

      // Handler invocato dal <select> formato in toolbar
      function onFormatSelectChange(value) {
        if (typeof value !== 'string' || value.indexOf('|') < 0) return;
        const [fmt, orient] = value.split('|');
        selectFormat(fmt, orient);
      }

      function selectFormat(fmt, orient) {
        // Sincronizza il <select> formato (utile quando selectFormat è
        // chiamato da init() con valore caricato da localStorage)
        const selectEl = document.getElementById('formatSelect');
        if (selectEl) {
          const wanted = fmt + '|' + orient;
          if (selectEl.value !== wanted) selectEl.value = wanted;
        }

        // Persisti il formato scelto (vedi FORMAT_STORAGE_KEY).
        try {
          localStorage.setItem(FORMAT_STORAGE_KEY, fmt + '|' + orient);
        } catch (_) {
          /* quota / private mode: ignora */
        }

        let w, h;
        if (fmt === 'A4') {
          w = 21;
          h = 29.7;
          PRINT_OFFSET_X_CM = PRINT_OFFSET_A4_X_CM;
          PRINT_OFFSET_Y_CM = PRINT_OFFSET_A4_Y_CM;
        }
        if (fmt === 'A3') {
          w = 29.7;
          h = 42;
          PRINT_OFFSET_X_CM = PRINT_OFFSET_A3_X_CM;
          PRINT_OFFSET_Y_CM = PRINT_OFFSET_A3_Y_CM;
        }
        if (fmt === 'SRA3') {
          // SRA3 standard ISO 217: 320 x 450 mm esatti (super A3).
          // IMPORTANTE: usare i valori esatti, non 319.8 x 449.8: il driver
          // di stampa riconosce 320x450 come preset, e con valori più piccoli
          // farebbe snap al preset lasciando un sottile bordo non stampato
          // sul lato destro/basso.
          w = 32.0;
          h = 45.0;
          PRINT_OFFSET_X_CM = PRINT_OFFSET_SRA3_X_CM;
          PRINT_OFFSET_Y_CM = PRINT_OFFSET_SRA3_Y_CM;
        }
        if (orient === 'landscape') [w, h] = [h, w];

        page.pageWidth = w;
        page.pageHeight = h;
        page.backColor = PRINT_BLACK;

        // Cambio formato → le celle hanno dimensioni completamente diverse,
        // i transform per cella perdono senso. Reset totale così l'utente
        // riparte sempre con il default "fit alla cella".
        imageTransforms.clear();

        // Skip designer.renderHtml: il designer è nascosto.
        if (currentGridType) {
          void queueGridBuild(currentGridType, 'selectFormat');
        }
        // addGrid già chiama renderEditorView, che ricalcola il fit della
        // pagina nello spazio disponibile.
      }

      // (rimosse le helper Stimulsoft-zoom: ora il fit della pagina è
      // gestito direttamente da renderEditorView sul nostro #editor-page)

      function getPatientInfo() {
        try {
          const info = window.parent && window.parent.nolexPatientInfo;
          if (info && typeof info === 'object') return info;
        } catch (_) {
          /* cross-origin fallback */
        }
        try {
          return JSON.parse(localStorage.getItem('nolex-patient-info') || '{}');
        } catch {
          return {};
        }
      }

      function getStudyInfo() {
        try {
          const info = window.parent && window.parent.nolexStudyInfo;
          if (info && typeof info === 'object') return info;
        } catch (_) {
          /* cross-origin fallback */
        }
        try {
          return JSON.parse(localStorage.getItem('nolex-study-info') || '{}');
        } catch {
          return {};
        }
      }

      function buildStudyTitleText(patient, study) {
        const patientName = patient.PatientName ? patient.PatientName.replace(/,/g, ' ') : '';
        const dob = formatPatientDate(patient.PatientDOB || '');
        const modality = study.Modality || '';
        const studyDesc = study.StudyDescription || '';
        const studyDate = formatPatientDate(study.StudyDate || '');

        const parts = [];
        if (patientName) parts.push(patientName);
        if (dob) parts.push(dob);

        let studyPart = '';
        if (modality) studyPart += modality;
        if (studyDesc) {
          studyPart += `${studyPart ? ' ' : ''}(${studyDesc})`;
        }
        if (studyDate) {
          studyPart += `${studyPart ? ' del ' : ''}${studyDate}`;
        }

        if (studyPart) parts.push(studyPart);
        return parts.join(' ').trim();
      }

      function createSolidBlackDataUrl(widthCm, heightCm) {
        const PX = 96 / 2.54;
        const canvasW = Math.round(widthCm * PX);
        const canvasH = Math.round(heightCm * PX);
        const canvas = document.createElement('canvas');
        canvas.width = canvasW;
        canvas.height = canvasH;
        const ctx = canvas.getContext('2d');
        ctx.fillStyle = PRINT_BLACK;
        ctx.fillRect(0, 0, canvasW, canvasH);
        return canvas.toDataURL('image/png');
      }

      const emptyCellBorderCache = new Map();

      function createEmptyCellBorderDataUrl(widthCm, heightCm) {
        const PX = 96 / 2.54;
        const wpx = Math.max(1, Math.round(widthCm * PX));
        const hpx = Math.max(1, Math.round(heightCm * PX));
        const key = `${wpx}x${hpx}`;
        if (emptyCellBorderCache.has(key)) {
          return emptyCellBorderCache.get(key);
        }

        const canvas = document.createElement('canvas');
        canvas.width = wpx;
        canvas.height = hpx;
        const ctx = canvas.getContext('2d');
        ctx.fillStyle = PRINT_BLACK;
        ctx.fillRect(0, 0, wpx, hpx);
        ctx.strokeStyle = '#ffffff';
        ctx.lineWidth = 2;
        ctx.strokeRect(1, 1, wpx - 2, hpx - 2);

        const url = canvas.toDataURL('image/png');
        emptyCellBorderCache.set(key, url);
        return url;
      }

      function applyGlobalOffset(dx, dy) {
        if (!page) return;
        const prev = page._nolexOffsetApplied || { x: 0, y: 0 };
        const deltaX = dx - prev.x;
        const deltaY = dy - prev.y;
        if (!deltaX && !deltaY) return;

        for (let i = 0; i < page.components.count; i++) {
          const comp = page.components.getByIndex(i);
          if (!comp || typeof comp.left !== 'number' || typeof comp.top !== 'number') {
            continue;
          }
          comp.left += deltaX;
          comp.top += deltaY;
        }

        page._nolexOffsetApplied = { x: dx, y: dy };
      }

      function ensureEmptyCellBorders(rows, cols, cellW, cellH, topOffset = 0) {
        if (!page) return;

        for (let i = page.components.count - 1; i >= 0; i--) {
          const comp = page.components.getByIndex(i);
          if (comp && comp.name && comp.name.startsWith('CellBorderEmpty_')) {
            page.components.removeAt(i);
          }
        }

        const occupied = new Set();
        for (let i = 0; i < page.components.count; i++) {
          const comp = page.components.getByIndex(i);
          if (comp && comp.name && comp.name.startsWith('Image_')) {
            const parts = comp.name.split('_');
            if (parts.length >= 3) {
              const r = parseInt(parts[1]);
              const c = parseInt(parts[2]);
              if (!isNaN(r) && !isNaN(c)) {
                occupied.add(`${r}_${c}`);
              }
            }
          }
        }

        const dataUrl = createEmptyCellBorderDataUrl(cellW, cellH);

        for (let r = 0; r < rows; r++) {
          for (let c = 0; c < cols; c++) {
            if (occupied.has(`${r}_${c}`)) continue;
            const img = new Stimulsoft.Report.Components.StiImage();
            img.imageURL = dataUrl;
            img.imageAsBase64 = true;
            img.left = c * cellW;
            img.top = topOffset + r * cellH;
            img.width = cellW;
            img.height = cellH;
            img.stretch = true;
            img.aspectRatio = false;
            img.keepAspectRatio = false;
            img.locked = true;
            img.enabled = true;
            img.allowResize = false;
            img.allowMove = false;
            img.printable = true;
            img.name = `CellBorderEmpty_${r}_${c}`;
            page.components.add(img);
          }
        }
      }

      function getComposeKey(wpx, hpx) {
        return `${wpx}x${hpx}`;
      }

      function buildPatientInfoLines(patient, study) {
        const patientName = patient?.PatientName ? patient.PatientName.replace(/,/g, ' ') : '';
        const patientId = patient?.PatientID || '';
        const sex = patient?.PatientSex || '';
        const dob = formatPatientDate(patient?.PatientDOB || '');
        const sexDob = `${sex}${sex && dob ? ' ' : ''}${dob}`.trim();
        const accession = study?.AccessionNumber || '';

        const lines = [];
        if (patientName) lines.push({ text: patientName, bold: true });
        if (sexDob) lines.push({ text: sexDob, bold: false });
        if (patientId) lines.push({ text: `ID: ${patientId}`, bold: true });
        if (accession) lines.push({ text: `Acc: ${accession}`, bold: false });
        return lines;
      }

      function drawPatientInfoOnCanvas(ctx, targetWpx, targetHpx) {
        // Disegna le info paziente solo se l'utente l'ha richiesto
        // dalla checkbox "Info esame" in toolbar.
        if (!showPatientInfo) return;
        const patient = getPatientInfo();
        if (!patient || !patient.PatientID) return;
        const study = getStudyInfo();
        const lines = buildPatientInfoLines(patient, study);
        if (!lines.length) return;

        // paddingX (= posizione LEFT) NON dipende dal moltiplicatore:
        // resta sempre alla stessa distanza dal bordo. Solo la fontSize
        // (e di conseguenza il lineHeight) viene scalata.
        const paddingX = Math.round(targetWpx * 0.03);
        const paddingY = Math.round(targetHpx * 0.03);
        const fontSize = Math.max(4, Math.round(targetHpx * 0.02 * infoSizeMultiplier));
        const lineHeight = Math.round(fontSize * 1.08);
        const fontNormal = `${fontSize}px sans-serif`;
        const fontBold = `bold ${fontSize}px sans-serif`;

        ctx.fillStyle = '#ffffff';
        ctx.textBaseline = 'top';

        let y = paddingY;
        for (const line of lines) {
          ctx.font = line.bold ? fontBold : fontNormal;
          ctx.fillText(line.text, paddingX, y);
          y += lineHeight;
        }
      }

      // transform: { zoom, panX, panY } in unità: zoom = moltiplicatore,
      // panX/panY in CM (page units). Default: nessuna trasformazione.
      function composeImageOnBlack(img, targetWpx, targetHpx, scaleW, scaleH, transform) {
        const t = transform || TRANSFORM_DEFAULT;

        // Bordi bianchi della griglia (vedi sotto): l'immagine deve fittarsi
        // nell'AREA INTERNA della cella, lasciando i bordi visibili. La
        // scala "fit" viene quindi calcolata sull'inner box (innerW × innerH),
        // non sull'intera cella.
        const linePx = 2;
        const innerW = Math.max(1, targetWpx - 2 * linePx);
        const innerH = Math.max(1, targetHpx - 2 * linePx);

        // I parametri scaleW/scaleH passati dai chiamanti sono "ingenui"
        // (basati su targetWpx/targetHpx). Li ricalcoliamo qui sull'inner
        // box, ignorando quelli passati, così il fit di default lascia
        // sempre visibili i bordi bianchi.
        const scaleW_eff = innerW / img.width;
        const scaleH_eff = innerH / img.height;
        const baseScale = Math.min(scaleW_eff, scaleH_eff);
        const scale = baseScale * (t.zoom || 1);
        const drawW = img.width * scale;
        const drawH = img.height * scale;

        // Conversione cm → px nello stesso DPI di compose (96 dpi).
        // I pan sono in cm in modo che restino consistenti se la cella
        // viene ricomposta a una risoluzione diversa.
        const PX_PER_CM = 96 / 2.54;
        const panXpx = (t.panX || 0) * PX_PER_CM;
        const panYpx = (t.panY || 0) * PX_PER_CM;

        // Centriamo nell'INNER box (centro cella + offset pan).
        const drawX = Math.round((targetWpx - drawW) / 2 + panXpx);
        const drawY = Math.round((targetHpx - drawH) / 2 + panYpx);

        const canvas = document.createElement('canvas');
        canvas.width = targetWpx;
        canvas.height = targetHpx;
        const ctx = canvas.getContext('2d');
        ctx.fillStyle = PRINT_BLACK;
        ctx.fillRect(0, 0, targetWpx, targetHpx);
        // Clipping all'AREA INTERNA della cella (non l'intera cella):
        // così l'immagine pannata/zoomata non solo non sborda nelle celle
        // adiacenti, ma non copre nemmeno i bordi bianchi della griglia
        // attorno alla cella.
        ctx.save();
        ctx.beginPath();
        ctx.rect(linePx, linePx, innerW, innerH);
        ctx.clip();
        ctx.drawImage(img, drawX, drawY, drawW, drawH);
        ctx.restore();

        drawPatientInfoOnCanvas(ctx, targetWpx, targetHpx);

        // Bordi bianchi della griglia (disegnati dopo l'immagine così
        // sono sempre visibili in primo piano)
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(0, 0, targetWpx, linePx);
        ctx.fillRect(0, targetHpx - linePx, targetWpx, linePx);
        ctx.fillRect(0, 0, linePx, targetHpx);
        ctx.fillRect(targetWpx - linePx, 0, linePx, targetHpx);

        return canvas.toDataURL('image/png');
      }

      function formatPatientDate(value) {
        if (!value || typeof value !== 'string') return '';
        const trimmed = value.trim();
        if (!trimmed) return '';

        // YYYY-MM-DD or YYYY/MM/DD
        const isoMatch = trimmed.match(/^(\d{4})[-/](\d{2})[-/](\d{2})$/);
        if (isoMatch) {
          return `${isoMatch[3]}/${isoMatch[2]}/${isoMatch[1]}`;
        }

        // YYYYMMDD
        const compactMatch = trimmed.match(/^(\d{4})(\d{2})(\d{2})$/);
        if (compactMatch) {
          return `${compactMatch[3]}/${compactMatch[2]}/${compactMatch[1]}`;
        }

        // DD-MM-YYYY to DD/MM/YYYY
        const dmMatch = trimmed.match(/^(\d{2})-(\d{2})-(\d{4})$/);
        if (dmMatch) {
          return `${dmMatch[1]}/${dmMatch[2]}/${dmMatch[3]}`;
        }

        // DD-Mon-YYYY (e.g. 24-May-1961)
        const dmonMatch = trimmed.match(/^(\d{2})-([A-Za-z]{3})-(\d{4})$/);
        if (dmonMatch) {
          const monthMap = {
            Jan: '01',
            Feb: '02',
            Mar: '03',
            Apr: '04',
            May: '05',
            Jun: '06',
            Jul: '07',
            Aug: '08',
            Sep: '09',
            Oct: '10',
            Nov: '11',
            Dec: '12',
          };
          const mon = dmonMatch[2][0].toUpperCase() + dmonMatch[2].slice(1, 3).toLowerCase();
          const mm = monthMap[mon] || dmonMatch[2];
          return `${dmonMatch[1]}/${mm}/${dmonMatch[3]}`;
        }

        return trimmed;
      }

      function createPatientHeaderDataUrl(widthCm, heightCm, patient) {
        const PX = 96 / 2.54;
        const canvasW = Math.round(widthCm * PX);
        const canvasH = Math.round(heightCm * PX);

        const canvas = document.createElement('canvas');
        canvas.width = canvasW;
        canvas.height = canvasH;
        const ctx = canvas.getContext('2d');

        // Transparent background for patient info
        ctx.clearRect(0, 0, canvasW, canvasH);

        // White text
        ctx.fillStyle = '#ffffff';
        ctx.textBaseline = 'top';

        const fontSize = Math.max(8, Math.round(canvasH * 0.24) - 8);
        const fontNormal = `${fontSize}px sans-serif`;
        const fontBold = `bold ${fontSize}px sans-serif`;

        const study = getStudyInfo();
        const patientName = patient.PatientName ? patient.PatientName.replace(/,/g, ' ') : '';
        const patientId = patient.PatientID || '';
        const sex = patient.PatientSex || '';
        const dob = formatPatientDate(patient.PatientDOB || '');
        const sexDob = `${sex}${sex && dob ? ' ' : ''}${dob}`.trim();
        const accession = study.AccessionNumber || '';

        const lines = [{ text: patientName, bold: true }];
        if (sexDob) {
          lines.push({ text: sexDob, bold: false });
        }
        if (patientId) {
          lines.push({ text: `ID: ${patientId}`, bold: true });
        }
        if (accession) {
          lines.push({ text: `Acc: ${accession}`, bold: false });
        }

        const lineGap = canvasH / (lines.length + 0.35);
        const startY = Math.round(canvasH * 0.14);
        lines.forEach((line, index) => {
          ctx.font = line.bold ? fontBold : fontNormal;
          ctx.fillText(line.text, 20, startY + index * lineGap);
        });

        return canvas.toDataURL('image/png');
      }

      function createStudyTitleDataUrl(widthCm, heightCm, text, textTopOffset = 0) {
        const PX = 96 / 2.54;
        const canvasW = Math.round(widthCm * PX);
        const canvasH = Math.round(heightCm * PX);

        const canvas = document.createElement('canvas');
        canvas.width = canvasW;
        canvas.height = canvasH;
        const ctx = canvas.getContext('2d');

        ctx.fillStyle = PRINT_BLACK;
        ctx.fillRect(0, 0, canvasW, canvasH);

        if (text) {
          const paddingX = 20;
          const maxWidth = canvasW - paddingX * 2;
          const fontSize = Math.max(9, Math.round(canvasH * 0.5) - 4);
          const lineHeight = Math.round(fontSize * 1.15);
          ctx.fillStyle = '#ffffff';
          ctx.font = `bold ${fontSize}px sans-serif`;
          ctx.textBaseline = 'top';

          const words = text.split(/\s+/).filter(Boolean);
          const lines = [];
          let current = '';
          words.forEach(word => {
            const next = current ? `${current} ${word}` : word;
            if (ctx.measureText(next).width <= maxWidth) {
              current = next;
              return;
            }
            if (current) {
              lines.push(current);
              current = word;
            } else {
              lines.push(word);
              current = '';
            }
          });
          if (current) lines.push(current);

          const maxLines = 2;
          if (lines.length > maxLines) {
            lines.length = maxLines;
            const last = lines[maxLines - 1];
            let trimmed = last;
            while (trimmed.length > 0 && ctx.measureText(`${trimmed}…`).width > maxWidth) {
              trimmed = trimmed.slice(0, -1);
            }
            lines[maxLines - 1] = trimmed ? `${trimmed}…` : '…';
          }

          const totalHeight = lines.length * lineHeight;
          let y = Math.max(0, Math.round((canvasH - totalHeight) / 2) + textTopOffset);
          lines.forEach(line => {
            ctx.fillText(line, paddingX, y);
            y += lineHeight;
          });
        }

        return canvas.toDataURL('image/png');
      }

      function addStudyTitle(text, widthCm, heightCm, textTopOffset = 0) {
        if (!page) return;

        for (let i = page.components.count - 1; i >= 0; i--) {
          const component = page.components.getByIndex(i);
          if (component && component.name === 'StudyTitle') {
            page.components.removeAt(i);
          }
        }

        if (!text || !heightCm) {
          return;
        }

        const dataUrl = createStudyTitleDataUrl(widthCm, heightCm, text, textTopOffset);
        const img = new Stimulsoft.Report.Components.StiImage();
        img.imageURL = dataUrl;
        img.imageAsBase64 = true;
        img.left = 0;
        img.top = 0;
        img.width = widthCm;
        img.height = heightCm;
        img.stretch = true;
        img.aspectRatio = false;
        img.keepAspectRatio = false;
        img.locked = true;
        img.enabled = true;
        img.allowResize = false;
        img.allowMove = false;
        img.printable = true;
        img.name = 'StudyTitle';

        page.components.add(img);
      }

      async function addPatientHeader() {
        const patient = getPatientInfo();
        if (!patient || !patient.PatientID) return;

        // Header globale non usato quando disegniamo info per cella
        const existingHeader = getPatientHeaderComponent();
        if (existingHeader) {
          page.components.remove(existingHeader);
        }

        // Dimensioni dell'header in CM
        const headerH = 2; // 2 cm altezza
        const headerW = page.pageWidth; // tutta la larghezza della pagina

        // Converti cm in pixel (96 dpi circa, sufficiente)
        const PX = 96 / 2.54;
        const canvasW = Math.round(headerW * PX);
        const canvasH = Math.round(headerH * PX);

        // CREA CANVAS
        const canvas = document.createElement('canvas');
        canvas.width = canvasW;
        canvas.height = canvasH;
        const ctx = canvas.getContext('2d');

        // SFONDO NERO
        ctx.fillStyle = PRINT_BLACK;
        ctx.fillRect(0, 0, canvasW, canvasH);

        // TESTO BIANCO
        ctx.fillStyle = '#ffffff';
        ctx.textBaseline = 'top';

        const fontSize = Math.max(8, Math.round(canvasH * 0.24) - 8);
        const fontNormal = `${fontSize}px sans-serif`;
        const fontBold = `bold ${fontSize}px sans-serif`;

        const study = getStudyInfo();
        const patientName = patient.PatientName ? patient.PatientName.replace(/,/g, ' ') : '';
        const patientId = patient.PatientID || '';
        const sex = patient.PatientSex || '';
        const dob = formatPatientDate(patient.PatientDOB || '');
        const sexDob = `${sex}${sex && dob ? ' ' : ''}${dob}`.trim();
        const accession = study.AccessionNumber || '';

        const lines = [{ text: patientName, bold: true }];
        if (sexDob) {
          lines.push({ text: sexDob, bold: false });
        }
        if (patientId) {
          lines.push({ text: `ID: ${patientId}`, bold: true });
        }
        if (accession) {
          lines.push({ text: `Acc: ${accession}`, bold: false });
        }

        const lineGap = canvasH / (lines.length - 0.1);
        const startY = Math.round(canvasH * 0.14);
        lines.forEach((line, index) => {
          ctx.font = line.bold ? fontBold : fontNormal;
          ctx.fillText(line.text, 20, startY + index * lineGap);
        });

        // OTTIENI BASE64
        const dataUrl = canvas.toDataURL('image/png');

        // CREA IMMAGINE STIMULSOFT
        const stiImg = new Stimulsoft.Report.Components.StiImage();
        stiImg.imageURL = dataUrl;
        stiImg.imageAsBase64 = true;

        stiImg.left = 0;
        stiImg.top = 0;
        stiImg.width = headerW;
        stiImg.height = headerH;

        stiImg.stretch = true;
        stiImg.aspectRatio = false;
        stiImg.keepAspectRatio = false; // IMPORTANTE: permette di deformare l'immagine

        // PROPRIETA CRITICHE (uguali alle altre immagini)
        stiImg.locked = true; // non modificabile dall'utente
        stiImg.enabled = true; // DEVE ESSERE TRUE!
        stiImg.allowResize = false;
        stiImg.allowMove = false;
        stiImg.printable = true; // DEVE ESSERE TRUE per la stampa!
        stiImg.name = 'PatientHeaderImage';

        // Non aggiungiamo header globale per evitare duplicati con le etichette per cella
      }
      function getPatientHeaderComponent() {
        if (!page) return null;

        for (let i = 0; i < page.components.count; i++) {
          const component = page.components.getByIndex(i);
          if (component && component.name === 'PatientHeaderImage') {
            return component;
          }
        }

        return null;
      }

      /* --- TROVA CELLA VUOTA --- */
      function findEmptyCell() {
        if (!currentGridType) {
          console.log('Nessun layout selezionato');
          return null;
        }

        const [rows, cols] = currentGridType.split('x').map(Number);
        console.log(`Cerco celle vuote in layout ${rows}x${cols}`);

        // Crea una mappa per tenere traccia delle celle occupate
        const occupiedCells = new Set();

        // Scansiona tutti i componenti della pagina
        for (let i = 0; i < page.components.count; i++) {
          const component = page.components.getByIndex(i);

          if (component && component.name && component.name.startsWith('Image_')) {
            const parts = component.name.split('_');
            if (parts.length >= 3) {
              const row = parseInt(parts[1]);
              const col = parseInt(parts[2]);

              if (!isNaN(row) && !isNaN(col) && row < rows && col < cols) {
                occupiedCells.add(`${row}_${col}`);
                console.log(`Cella occupata: [${row},${col}] - ${component.name}`);
              }
            }
          }
        }

        // Cerca la prima cella vuota (in ordine di riga, poi colonna)
        for (let r = 0; r < rows; r++) {
          for (let c = 0; c < cols; c++) {
            if (!occupiedCells.has(`${r}_${c}`)) {
              console.log(`Trovata cella vuota: [${r},${c}]`);
              return { row: r, col: c };
            }
          }
        }

        console.log('Nessuna cella vuota trovata');
        return null; // Tutte le celle sono occupate
      }

        // Sincronizza la checkbox "Info esame" con lo stato persistito
        // (showPatientInfo è stato letto da localStorage al top del file).

        if (infoCheckbox) infoCheckbox.checked = showPatientInfo;
        // Sincronizza il select dimensione e nascondilo se le info sono OFF

        const annotCheckbox = document.getElementById('annotazioniCheckbox');
        if (annotCheckbox) annotCheckbox.checked = showAnnotations;

        // L'auto-grid sceglierà a refreshPreferiti il layout in base al numero
        // di immagini; per ora partiamo con 1x1 (default vuoto).
        selectGrid('1x1');
        highlightMegaGridLayout('1x1');
        renderEditorView();

        // Auto-init: facciamo SUBITO un refresh dei preferiti dal parent.
        // Così quando il browser sarà idle e l'iframe sarà precaricato in
        // background, l'auto-grid sarà già applicato anche se la modale
        // è ancora display:none. firstRefreshDone diventerà true e
        // maybeRevealEditor partirà non appena la modale verrà aperta
        // (ResizeObserver fires → wrapper acquisisce dimensioni → reveal).
        refreshPreferiti();

        // ResizeObserver sul wrapper dell'editor: ricalcola il fit ogni volta
        // che il wrapper riceve dimensioni nuove.
        //
        // PERCHÉ SERVE: l'iframe è precaricato in background dentro una modale
        // `display:none`, quindi al primo init() il wrapper ha clientWidth = 0
        // e renderEditorView calcola un fit minimo (~10%) → la pagina si vede
        // piccola. Alla prima apertura della modale (display:flex) il wrapper
        // ottiene le sue dimensioni reali e ResizeObserver fa rientrare
        // automaticamente renderEditorView con le dimensioni corrette,
        // PRIMA del prossimo paint → niente flash visivo.
        const wrapper = document.getElementById('editor-canvas-wrapper');
        if (wrapper && 'ResizeObserver' in window) {
          let lastW = -1;
          let lastH = -1;
          const ro = new ResizeObserver(entries => {
            const entry = entries[0];
            if (!entry) return;
            const cr = entry.contentRect;
            const newW = Math.round(cr.width);
            const newH = Math.round(cr.height);
            // Filtro micro-variazioni (sub-pixel rounding)
            if (Math.abs(newW - lastW) < 2 && Math.abs(newH - lastH) < 2) return;
            lastW = newW;
            lastH = newH;
            renderEditorView();
            // Se questo è il primo resize "vero" (modale appena aperta) e
            // il primo refresh dei preferiti è già completo, è il momento
            // giusto per rivelare l'editor: il render è appena stato fatto
            // alla dimensione finale e l'auto-grid è già applicato.
            maybeRevealEditor();
          });
          ro.observe(wrapper);
        }

        // Su resize della finestra (parent), ricomputiamo il fit anche
        // tramite il listener tradizionale (fallback per browser senza
        // ResizeObserver e per cambi di window che non triggerano l'osservatore
        // sull'iframe).
        let resizeTimer = null;
        window.addEventListener('resize', () => {
          if (resizeTimer) clearTimeout(resizeTimer);
          resizeTimer = setTimeout(() => {
            renderEditorView();
          }, 80);
        });

        // SAFETY NET: se per qualche motivo lo spinner non viene mai
        // rimosso (es. wrapper sempre 0×0 perché la modale non viene mai
        // aperta — improbabile, oppure un edge case che ci sfugge),
        // forziamo la rimozione dopo 8 secondi dall'init. Niente di
        // visibile per l'utente perché lo spinner sta dentro la modale
        // che è ancora display:none, ma garantisce che alla prima
        // apertura della modale l'editor sia comunque visibile.
        setTimeout(() => {
          if (editorRevealed) return;
          editorRevealed = true;
          const ed = document.getElementById('nolex-editor');
          if (ed) ed.classList.add('ready');
        }, 8000);
      }
